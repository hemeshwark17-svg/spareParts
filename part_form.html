{% extends "base.html" %}{% block title %}{{ heading }}{% endblock %}{% block content %}<a class="back" href="{{ url_for('admin') }}">← Back to inventory</a><form class="form-card wide" method="post"><div class="eyebrow">INVENTORY DETAILS</div><h1>{{ heading }}</h1><div class="form-grid">
<label>Part number *<input name="part_number" required maxlength="40" value="{{ part.part_number if part else '' }}"></label><label>Part name *<input name="part_name" required maxlength="120" value="{{ part.part_name if part else '' }}"></label>
<label>Category<input name="category" required value="{{ part.category if part else 'Other' }}"></label><label>Compatible vehicles<input name="vehicle_compatibility" value="{{ part.vehicle_compatibility if part else 'Multiple models' }}"></label>
<label>Price (₹)<input type="number" name="price" min="0" step="0.01" required value="{{ part.price if part else '0.00' }}"></label><label>Stock quantity<input type="number" name="stock_quantity" min="0" step="1" required value="{{ part.stock_quantity if part else 0 }}"></label>
<label class="full">Supplier name<input name="supplier_name" value="{{ part.supplier_name if part else 'Demo Supplier' }}"></label><label class="full">Description<textarea name="description" rows="3">{{ part.description if part else '' }}</textarea></label>
<label class="check full"><input type="checkbox" name="is_active" {% if not part or part.is_active %}checked{% endif %}> Show in public catalogue</label></div><div class="form-actions"><button>Save part</button><a class="button secondary" href="{{ url_for('admin') }}">Cancel</a></div></form>{% endblock %}
